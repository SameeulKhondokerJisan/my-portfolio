<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Sameeul Khondoker Jisan</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0a0f0d" />
  <!-- GitHub Pages serves this file for any missing path, at any depth,
       so every URL here is absolute to the project site. -->
  <link rel="icon" href="/my-portfolio/icons/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/my-portfolio/icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/my-portfolio/css/styles.css" />
  <script>
    (function () {
      var d = document.documentElement, t;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      d.setAttribute('data-theme', t);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'light' ? '#f7f6f2' : '#0a0f0d');
    })();
  </script>
  <style>
    .nf{min-height:100vh;min-height:100svh;display:grid;place-items:center;text-align:center;padding:2rem var(--gutter);}
    .nf-code{font-family:var(--font-d);font-weight:800;font-size:clamp(4.5rem,3rem + 8vw,8rem);line-height:1;letter-spacing:-.04em;color:var(--accent);margin-bottom:.75rem;}
    .nf .section-sub{margin:.9rem auto 1.75rem;}
    .nf .hero-cta{justify-content:center;margin-bottom:0;}
  </style>
</head>
<body>
  <main class="nf">
    <div>
      <p class="nf-code">404</p>
      <h1 class="section-title">This page doesn’t exist</h1>
      <p class="section-sub">The link may be old or mistyped. Everything is on the main page.</p>
      <div class="hero-cta">
        <a class="btn btn-primary" href="/my-portfolio/">Back to the portfolio</a>
        <a class="btn btn-ghost" href="/my-portfolio/#contact">Contact me</a>
      </div>
    </div>
  </main>
</body>
</html>
